<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="tsmark — CommonMarkをHTML、DOM、ASTへ変換するTypeScriptパーサー"
    >
    <title>tsmark playground</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17201d;
        --muted: #62706b;
        --paper: #f4f1e8;
        --panel: #fffdf7;
        --line: #d7d2c4;
        --accent: #087f5b;
        --accent-soft: #dff4eb;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 0%, #e6f5ec 0, transparent 32rem),
          var(--paper);
      }

      header,
      main {
        width: min(1180px, calc(100% - 2rem));
        margin-inline: auto;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 2rem;
        padding: 3.5rem 0 1.5rem;
      }

      h1 {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 0.9;
        letter-spacing: -0.08em;
      }

      header p {
        max-width: 34rem;
        margin: 0.8rem 0 0;
        color: var(--muted);
      }

      header a {
        flex: none;
        color: var(--accent);
        font-weight: 700;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 1rem;
        padding-bottom: 3rem;
      }

      .panel {
        overflow: hidden;
        min-height: 22rem;
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        box-shadow: 0 12px 30px rgb(31 44 38 / 8%);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 3.25rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--line);
      }

      .panel-header h2 {
        margin: 0;
        font-size: 0.8rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .badge {
        padding: 0.25rem 0.55rem;
        border-radius: 999px;
        color: var(--accent);
        background: var(--accent-soft);
        font-size: 0.72rem;
        font-weight: 700;
      }

      textarea,
      pre {
        width: 100%;
        min-height: 26rem;
        margin: 0;
        padding: 1.25rem;
        border: 0;
        color: inherit;
        background: transparent;
        font: 0.9rem/1.65 ui-monospace, SFMono-Regular, Consolas, monospace;
        tab-size: 2;
      }

      textarea {
        display: block;
        resize: vertical;
        outline: none;
      }

      textarea:focus {
        box-shadow: inset 0 0 0 2px var(--accent);
      }

      pre {
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .outputs {
        display: grid;
        gap: 1rem;
      }

      .preview {
        min-height: 15rem;
        padding: 1.25rem;
        line-height: 1.65;
      }

      .preview > :first-child {
        margin-top: 0;
      }

      .preview pre {
        min-height: auto;
        padding: 1rem;
        border-radius: 0.5rem;
        background: #ece9df;
      }

      .tabs {
        display: flex;
        gap: 0.35rem;
      }

      button {
        padding: 0.4rem 0.7rem;
        border: 0;
        border-radius: 0.45rem;
        color: var(--muted);
        background: transparent;
        font: inherit;
        cursor: pointer;
      }

      button[aria-selected="true"] {
        color: white;
        background: var(--accent);
      }

      [hidden] {
        display: none;
      }

      @media (max-width: 760px) {
        header {
          align-items: start;
          flex-direction: column;
          padding-top: 2rem;
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        textarea,
        pre {
          min-height: 20rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>tsmark</h1>
        <p>
          Markdownを意味論的なASTへ変換し、HTML文字列またはブラウザDOMとして
          出力するCommonMark 0.31.2パーサーです。
        </p>
      </div>
      <a href="https://github.com/azulamb/tsmark">GitHub →</a>
    </header>

    <main class="workspace">
      <section class="panel">
        <div class="panel-header">
          <h2>Markdown</h2>
          <span class="badge">編集できます</span>
        </div>
        <textarea id="source" spellcheck="false" aria-label="Markdown source"># CommonMark playground

`tsmark` は **Markdown** を次の形式へ変換します。

- 意味論的なAST
- HTML文字列
- ブラウザDOM

> 左側を編集すると、結果が即座に更新されます。

```ts
const ast = tsmark.parse(markdown);
const html = tsmark.renderHTML(ast);
```
</textarea>
      </section>

      <section class="outputs">
        <section class="panel">
          <div class="panel-header">
            <h2>Result</h2>
            <div class="tabs" role="tablist" aria-label="出力形式">
              <button
                id="preview-tab"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="preview"
              >Preview</button>
              <button
                id="html-tab"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="html-output"
              >HTML</button>
              <button
                id="ast-tab"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="ast-output"
              >AST</button>
            </div>
          </div>
          <div id="preview" class="preview" role="tabpanel"></div>
          <pre id="html-output" role="tabpanel" hidden></pre>
          <pre id="ast-output" role="tabpanel" hidden></pre>
        </section>
      </section>
    </main>

    <script src="./tsmark.js"></script>
    <script>
      const source = document.querySelector('#source');
      const preview = document.querySelector('#preview');
      const htmlOutput = document.querySelector('#html-output');
      const astOutput = document.querySelector('#ast-output');
      const tabs = [...document.querySelectorAll('[role="tab"]')];
      const panels = [preview, htmlOutput, astOutput];

      function update() {
        const ast = tsmark.parse(source.value);
        htmlOutput.textContent = tsmark.renderHTML(ast);
        astOutput.textContent = JSON.stringify(ast, null, 2);
        preview.replaceChildren(
          tsmark.renderDOM(ast, document, { rawHTML: 'text' }),
        );
      }

      for (const tab of tabs) {
        tab.addEventListener('click', () => {
          for (const candidate of tabs) {
            candidate.setAttribute(
              'aria-selected',
              String(candidate === tab),
            );
          }
          for (const panel of panels) {
            panel.hidden = panel.id !== tab.getAttribute('aria-controls');
          }
        });
      }

      source.addEventListener('input', update);
      update();
    </script>
  </body>
</html>
